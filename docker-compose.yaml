# Local development database only. Production uses Neon.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: planbord
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: planbord_dev
    ports:
      - "5432:5432"
    volumes:
      - planbord-data:/var/lib/postgresql/data

volumes:
  planbord-data:
